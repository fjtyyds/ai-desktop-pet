<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <title>AI 桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <main id="pet-card" class="pet-card">
      <header class="drag-bar">
        <span id="header-title" class="drag-bar-title">AI 桌宠</span>
        <div class="drag-bar-actions">
          <!-- T-25：导出对话移入聊天工具栏（设置页导出区块已移除） -->
          <div id="toolbar-export" class="toolbar-export">
            <button
              id="export-btn"
              class="icon-btn"
              type="button"
              title="导出对话"
              aria-label="导出对话"
              aria-haspopup="menu"
              aria-expanded="false"
              data-i18n-title="data.exportTitle"
              data-i18n-aria-label="data.exportTitle"
            >⇩</button>
            <div
              id="export-menu"
              class="export-menu"
              role="menu"
              aria-label="导出对话"
              data-i18n-aria-label="data.exportTitle"
              hidden
            >
              <button
                id="export-md"
                class="export-menu-item"
                type="button"
                role="menuitem"
                data-i18n="data.exportMarkdown"
              >导出 Markdown</button>
              <button
                id="export-json"
                class="export-menu-item"
                type="button"
                role="menuitem"
                data-i18n="data.exportJson"
              >导出 JSON</button>
              <p
                id="export-status"
                class="settings-status export-status"
                role="status"
                hidden
              ></p>
            </div>
          </div>
          <button
            id="settings-btn"
            class="icon-btn"
            type="button"
            title="设置"
            aria-label="设置"
            data-i18n-title="settings.title"
            data-i18n-aria-label="settings.title"
          >⚙</button>
          <button
            id="minimize-btn"
            class="icon-btn"
            type="button"
            title="最小化到任务栏"
            aria-label="最小化"
            data-i18n-title="window.minimizeTitle"
            data-i18n-aria-label="window.minimize"
          >—</button>
          <button
            id="close-btn"
            class="icon-btn"
            type="button"
            title="关闭（隐藏到托盘）"
            aria-label="关闭"
            data-i18n-title="window.closeTitle"
            data-i18n-aria-label="window.close"
          >✕</button>
        </div>
      </header>

      <section
        id="chat-view"
        class="chat-view"
        role="region"
        aria-label="聊天"
        data-i18n-aria-label="chat.viewAriaLabel"
      >
        <div
          id="weather-widget"
          class="weather-widget collapsed"
          role="region"
          aria-label="天气小部件"
          data-i18n-aria-label="weather.widgetAriaLabel"
          hidden
        >
          <div class="weather-main">
            <span id="weather-icon" class="weather-icon" aria-hidden="true">🌡️</span>
            <div class="weather-info">
              <span id="weather-location" class="weather-location"></span>
              <span id="weather-desc" class="weather-desc"></span>
            </div>
            <span id="weather-temp" class="weather-temp"></span>
            <button
              id="weather-toggle"
              class="icon-btn weather-toggle-btn"
              type="button"
              title="展开天气"
              aria-label="展开天气"
              aria-expanded="false"
              data-i18n-title="weather.expand"
              data-i18n-aria-label="weather.expand"
            >▸</button>
            <button
              id="weather-refresh"
              class="icon-btn weather-refresh-btn"
              type="button"
              title="刷新"
              aria-label="刷新"
              data-i18n-title="weather.refresh"
              data-i18n-aria-label="weather.refresh"
            >↻</button>
          </div>
          <div id="weather-meta" class="weather-meta" role="status"></div>
          <div id="weather-updated" class="weather-updated"></div>
        </div>
        <div
          id="mood-indicator"
          class="mood-indicator mood-neutral"
          role="status"
          aria-live="polite"
          data-mood-label="平静"
          data-valence="60"
          data-intensity="0.35"
          hidden
        >
          <span id="mood-face" class="mood-face" aria-hidden="true">🙂</span>
          <span id="mood-label" class="mood-label">平静</span>
        </div>
        <!-- T-21：番茄钟小部件（系统状态小部件已按 T-30 移除） -->
          <div id="pomodoro-widget" class="widget-card">
            <div class="widget-card-header">
              <span class="widget-title" data-i18n="pomodoro.title">番茄钟</span>
            </div>
            <div
              id="pomodoro-time"
              class="pomodoro-time"
              role="timer"
              aria-live="polite"
            >25:00</div>
            <div class="pomodoro-controls">
              <button
                id="pomodoro-start"
                class="secondary-btn"
                type="button"
                data-i18n="pomodoro.start"
              >开始</button>
              <button
                id="pomodoro-reset"
                class="secondary-btn"
                type="button"
                data-i18n="pomodoro.reset"
              >重置</button>
              <button
                id="pomodoro-stop"
                class="secondary-btn"
                type="button"
                data-i18n="pomodoro.stop"
              >停止</button>
            </div>
            <p id="pomodoro-status" class="widget-status" role="status" hidden></p>
          </div>
        <div id="message-list" class="message-list" aria-live="polite"></div>
        <div id="service-status" class="service-status" role="status"></div>
        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            placeholder="对桌宠说点什么…"
            autocomplete="off"
            aria-label="聊天输入框"
            data-i18n-aria-label="chat.inputAriaLabel"
            data-i18n-placeholder="chat.inputPlaceholder"
          />
          <button id="send-btn" class="send-btn" type="submit" data-i18n="chat.send">发送</button>
        </form>
      </section>

      <section
        id="settings-view"
        class="settings-view"
        role="region"
        aria-label="设置"
        data-i18n-aria-label="settings.title"
        hidden
      >
        <div id="settings-home" class="settings-page">
          <div class="settings-header">
            <button
              id="settings-back"
              class="icon-btn"
              type="button"
              aria-label="返回"
              data-i18n-aria-label="settings.back"
            >←</button>
            <h2 class="settings-title" data-i18n="settings.title">设置</h2>
          </div>
          <div class="settings-body">
          <label class="field">
            <span class="field-label" data-i18n="settings.apiKey">API Key</span>
            <input
              id="api-key"
              class="field-input"
              type="password"
              maxlength="256"
              autocomplete="off"
              spellcheck="false"
              placeholder="sk-…"
            />
            <span class="field-hint" data-i18n="settings.apiKeyHint"
              >密钥仅保存在本机，仅用于调用 DeepSeek 接口。</span
            >
          </label>
          <label class="field">
            <span class="field-label" data-i18n="settings.model">模型</span>
            <input
              id="model"
              class="field-input"
              type="text"
              maxlength="100"
              autocomplete="off"
              spellcheck="false"
              placeholder="deepseek-v4-flash"
            />
          </label>
          <label class="field">
            <span class="field-label" data-i18n="settings.language">界面语言</span>
            <select id="language" class="field-select">
              <option value="system" data-i18n="settings.languageSystem">跟随系统</option>
              <option value="zh-CN" data-i18n="settings.languageZhCN">简体中文</option>
              <option value="en" data-i18n="settings.languageEn">English</option>
            </select>
          </label>
          <label class="field field-switch">
            <span class="field-label" data-i18n="settings.idleEnabled">空闲互动</span>
            <input id="idle-enabled" class="field-checkbox" type="checkbox" />
            <span class="field-hint" data-i18n="settings.idleEnabledHint"
              >长时间无交互时，桌宠会主动冒泡和你打招呼；保存后生效，可随时关闭。</span
            >
          </label>
          <label class="field field-switch">
            <span class="field-label" data-i18n="weather.settingsLabel"
              >天气小部件</span
            >
            <input id="weather-enabled" class="field-checkbox" type="checkbox" />
            <span class="field-hint" data-i18n="weather.settingsHint"
              >在角色面板显示实时天气，城市可自由配置；数据来自 Open-Meteo，无需 API Key。</span
            >
          </label>
          <label class="field">
            <span class="field-label" data-i18n="weather.city">城市</span>
            <input
              id="weather-city"
              class="field-input"
              type="text"
              maxlength="64"
              autocomplete="off"
              spellcheck="false"
              placeholder="如：上海 / Shanghai"
              data-i18n-placeholder="weather.cityPlaceholder"
            />
          </label>
            <label class="field field-switch">
              <span class="field-label" data-i18n="settings.pomodoroEnabled"
                >番茄钟提醒</span
              >
              <input id="pomodoro-enabled" class="field-checkbox" type="checkbox" />
              <span class="field-hint" data-i18n="settings.pomodoroEnabledHint"
                >计时结束时弹出系统通知；关闭后仅保留界面计时。</span
              >
            </label>
            <label class="field">
              <span class="field-label" data-i18n="settings.pomodoroMinutes"
                >番茄钟时长（分钟）</span
              >
              <input
                id="pomodoro-minutes"
                class="field-input"
                type="number"
                min="1"
                max="120"
                step="1"
                inputmode="numeric"
              />
              <span class="field-hint" data-i18n="settings.pomodoroMinutesHint"
                >1–120 分钟，保存后生效。</span
              >
            </label>
          <label class="field">
            <span class="field-label" data-i18n="settings.petName">宠物名称</span>
            <input
              id="pet-name"
              class="field-input"
              type="text"
              maxlength="20"
              placeholder="AI 桌宠"
              data-i18n-placeholder="settings.petNamePlaceholder"
            />
          </label>
          <div class="field">
            <span id="persona-template-label" class="field-label"
              >人格模板</span
            >
            <span id="persona-template-hint" class="field-hint"
              >一键套用预设人格，之后仍可在下方手动微调。</span
            >
            <div
              id="persona-template-list"
              class="template-list"
              role="listbox"
              aria-label="人格模板"
            ></div>
          </div>
          <label class="field">
            <span class="field-label" data-i18n="settings.traits"
              >性格标签（逗号分隔，最多 10 个）</span
            >
            <input
              id="persona-traits"
              class="field-input"
              type="text"
              maxlength="200"
              placeholder="热情、友善、好奇"
              data-i18n-placeholder="settings.traitsPlaceholder"
            />
          </label>
          <label class="field">
            <span class="field-label" data-i18n="settings.tone">语气</span>
            <input
              id="persona-tone"
              class="field-input"
              type="text"
              maxlength="50"
              placeholder="温暖活泼"
              data-i18n-placeholder="settings.tonePlaceholder"
            />
          </label>
          <label class="field">
            <span class="field-label" data-i18n="settings.backstory">背景</span>
            <textarea
              id="persona-backstory"
              class="field-input field-textarea"
              maxlength="500"
              rows="4"
              placeholder="我是你的 AI 桌宠，喜欢陪你聊天、记住你在意的小事…"
              data-i18n-placeholder="settings.backstoryPlaceholder"
            ></textarea>
          </label>
          <button
            id="memory-manage-btn"
            class="secondary-btn"
            type="button"
            data-i18n="settings.memoryManage"
          >记忆管理</button>
          <button id="settings-save" class="primary-btn" type="button" data-i18n="settings.save"
            >保存设置</button
          >
          <p id="settings-status" class="settings-status" role="status" hidden></p>

          <div class="field">
            <span class="field-label" data-i18n="data.clearTitle">清除数据</span>
            <span class="field-hint" data-i18n="data.clearHint"
              >永久删除本地数据，此操作不可恢复。</span
            >
            <select
              id="clear-scope"
              class="field-select"
              aria-label="清除范围"
              data-i18n-aria-label="data.clearScope"
            >
              <option value="messages" data-i18n="data.scopeOptionMessages"
                >仅聊天记录</option
              >
              <option value="memories" data-i18n="data.scopeOptionMemories"
                >仅长期记忆</option
              >
              <option value="settings" data-i18n="data.scopeOptionSettings">仅设置</option>
              <option value="all" data-i18n="data.scopeOptionAll">全部数据</option>
            </select>
            <button
              id="clear-data"
              class="primary-btn"
              type="button"
              data-i18n="data.clearButton"
            >清除数据</button>
            <p id="clear-status" class="settings-status" role="status" hidden></p>
          </div>

          <p class="settings-note" data-i18n="settings.note">
            设置通过 petAPI.settings 持久化到本地，重启后仍生效；性格标签、语气与背景会进入桌宠的对话人格。
          </p>
        </div>
      </div>
      <div id="memory-page" class="settings-page" hidden>
        <div class="settings-header">
          <button
            id="memory-back"
            class="icon-btn"
            type="button"
            aria-label="返回"
            data-i18n-aria-label="settings.back"
          >←</button>
          <h2 class="settings-title" data-i18n="settings.memory">记忆</h2>
        </div>
        <div class="settings-body">
          <p class="memory-hint" data-i18n="settings.memoryHint">
            长期记忆由对话自动提取，可在此查看、修正或删除。
          </p>
          <p id="memory-status" class="settings-status" role="status" hidden></p>
          <p id="memory-empty" class="memory-empty" data-i18n="settings.memoryEmpty" hidden
            >暂无长期记忆，聊天中的关键事实会自动保存到这里。</p
          >
          <div id="memory-list" class="memory-list"></div>
        </div>
      </div>
        </div>
      </section>

      <section
        id="onboarding-view"
        class="onboarding-view"
        role="dialog"
        aria-modal="true"
        aria-labelledby="onboarding-title"
        hidden
      >
        <div class="onboarding-header">
          <h2 id="onboarding-title" class="onboarding-title"
            >欢迎使用 AI 桌宠</h2
          >
          <p id="onboarding-subtitle" class="onboarding-subtitle"
            >三步完成首次设置，随时可改。</p
          >
        </div>
        <ol
          id="onboarding-progress"
          class="onboarding-progress"
          aria-label="引导步骤"
        >
          <li
            id="onboarding-progress-1"
            class="onboarding-progress-item"
          >语言</li>
          <li
            id="onboarding-progress-2"
            class="onboarding-progress-item"
          >API Key 与模型</li>
          <li
            id="onboarding-progress-3"
            class="onboarding-progress-item"
          >人格模板</li>
        </ol>
        <div class="onboarding-body">
          <div id="onboarding-step-1" class="onboarding-step">
            <label class="field">
              <span class="field-label" data-i18n="settings.language">界面语言</span>
              <select id="onboarding-language" class="field-select">
                <option value="system" data-i18n="settings.languageSystem"
                  >跟随系统</option
                >
                <option value="zh-CN" data-i18n="settings.languageZhCN"
                  >简体中文</option
                >
                <option value="en" data-i18n="settings.languageEn">English</option>
              </select>
              <span id="onboarding-language-hint" class="field-hint"
                >界面语言会即时切换，也可以在设置中随时修改。</span
              >
            </label>
          </div>
          <div id="onboarding-step-2" class="onboarding-step" hidden>
            <label class="field">
              <span class="field-label" data-i18n="settings.apiKey">API Key</span>
              <input
                id="onboarding-api-key"
                class="field-input"
                type="password"
                maxlength="256"
                autocomplete="off"
                spellcheck="false"
                placeholder="sk-…"
              />
              <span class="field-hint" data-i18n="settings.apiKeyHint"
                >密钥仅保存在本机，仅用于调用 DeepSeek 接口。</span
              >
            </label>
            <label class="field">
              <span class="field-label" data-i18n="settings.model">模型</span>
              <input
                id="onboarding-model"
                class="field-input"
                type="text"
                maxlength="100"
                autocomplete="off"
                spellcheck="false"
                placeholder="deepseek-v4-flash"
              />
              <span id="onboarding-model-hint" class="field-hint"
                >不填写 API Key 时将以演示模式运行，随时可在设置中补充。</span
              >
            </label>
          </div>
          <div id="onboarding-step-3" class="onboarding-step" hidden>
            <p id="onboarding-step3-hint" class="onboarding-step-hint"
              >选择一位你喜欢的桌宠人格，之后可在设置中随时切换或微调。</p
            >
            <div
              id="onboarding-template-list"
              class="template-list"
              role="listbox"
              aria-label="人格模板"
            ></div>
          </div>
          <p id="onboarding-status" class="settings-status" role="status" hidden></p>
        </div>
        <div class="onboarding-actions">
          <button
            id="onboarding-back"
            class="secondary-btn"
            type="button"
            hidden
          >上一步</button>
          <button
            id="onboarding-next"
            class="primary-btn"
            type="button"
          >下一步</button>
          <button
            id="onboarding-finish"
            class="primary-btn"
            type="button"
            hidden
          >开始使用</button>
        </div>
      </section>

    </main>
    <script src="../shared/locales/index.js"></script>
    <script src="./chat.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
