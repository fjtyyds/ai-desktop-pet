<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <title>AI 桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <main id="pet-card" class="pet-card">
      <header class="drag-bar">
        <span id="header-title" class="drag-bar-title">AI 桌宠</span>
        <div class="drag-bar-actions">
          <button id="settings-btn" class="icon-btn" type="button" title="设置" aria-label="设置">⚙</button>
          <button id="close-btn" class="icon-btn" type="button" title="关闭（隐藏到托盘）" aria-label="关闭">✕</button>
        </div>
      </header>

      <section id="chat-view" class="chat-view">
        <div id="message-list" class="message-list" aria-live="polite"></div>
        <div id="service-status" class="service-status" role="status"></div>
        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            placeholder="对桌宠说点什么…"
            autocomplete="off"
            aria-label="聊天输入框"
          />
          <button id="send-btn" class="send-btn" type="submit">发送</button>
        </form>
      </section>

      <section id="settings-view" class="settings-view" hidden>
        <div class="settings-header">
          <button id="settings-back" class="icon-btn" type="button" aria-label="返回">←</button>
          <h2 class="settings-title">设置</h2>
        </div>
        <div class="settings-body">
          <label class="field">
            <span class="field-label">宠物名称</span>
            <input id="pet-name" class="field-input" type="text" maxlength="20" placeholder="AI 桌宠" />
          </label>
          <label class="field">
            <span class="field-label">性格标签（逗号分隔，最多 10 个）</span>
            <input
              id="persona-traits"
              class="field-input"
              type="text"
              maxlength="200"
              placeholder="热情、友善、好奇"
            />
          </label>
          <label class="field">
            <span class="field-label">语气</span>
            <input
              id="persona-tone"
              class="field-input"
              type="text"
              maxlength="50"
              placeholder="温暖活泼"
            />
          </label>
          <label class="field">
            <span class="field-label">背景</span>
            <textarea
              id="persona-backstory"
              class="field-input field-textarea"
              maxlength="500"
              rows="4"
              placeholder="我是你的 AI 桌宠，喜欢陪你聊天、记住你在意的小事…"
            ></textarea>
          </label>
          <button id="settings-save" class="primary-btn" type="button">保存设置</button>
          <p id="settings-status" class="settings-status" role="status" hidden></p>
          <p class="settings-note">
            设置通过 petAPI.settings 持久化到本地，重启后仍生效；性格标签、语气与背景会进入桌宠的对话人格。
          </p>
        </div>
      </section>

      <footer class="meta" id="meta"></footer>
    </main>
    <script src="./chat.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
