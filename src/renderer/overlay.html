<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'"
    />
    <title>AI 桌宠浮窗</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <!-- T-55：独立宠物浮窗（Codex Pets 式），仅角色 + 状态气泡 + 收起按钮 -->
    <div id="overlay-root" class="overlay-root">
      <button
        id="overlay-tuck"
        class="overlay-tuck"
        type="button"
        aria-label="隐藏宠物"
        data-i18n-aria-label="overlay.tuckAway"
      >✕</button>
      <div
        id="overlay-bubble"
        class="overlay-bubble"
        role="status"
        aria-live="polite"
        hidden
      >
        <span id="overlay-bubble-text"></span>
        <div id="overlay-bubble-progress" class="overlay-bubble-progress" hidden>
          <div id="overlay-bubble-progress-bar" class="overlay-bubble-progress-bar"></div>
          <span id="overlay-bubble-progress-label" class="overlay-bubble-progress-label"></span>
        </div>
      </div>
      <div id="overlay-pet" class="overlay-pet" aria-hidden="true"></div>
    </div>
    <script src="../shared/locales/index.js"></script>
    <script src="./overlay.js"></script>
  </body>
</html>
