# electron-builder 配置（ADR-016）：Windows NSIS 安装包 + 正式图标
# 依赖项 electron-builder 由协调者批准后加入 package.json devDependencies。
appId: com.aideskpet.app
productName: AI桌宠
copyright: Copyright © 2026 AI桌宠

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - package.json

asar: true
compression: normal

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: msix
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI桌宠
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  artifactName: ai-desktop-pet-${version}-Setup.${ext}

# T-52（ADR-040）：MSIX 打包（Microsoft Store 渠道；electron-builder 27 alpha 的 beta 能力）
# identityName/publisher 为占位值，待商店账号注册并在 Partner Center 保留名称后回填；
# runFullTrust 由默认 capabilities 自动注入（Electron 应用必需，不可移除）。
msix:
  artifactName: ai-desktop-pet-${version}-${arch}.${ext}
  identityName: AIDesktopPet.AiDesktopPet
  publisher: CN=Placeholder-Publisher
  publisherDisplayName: AI 桌宠项目组
  languages:
    - zh-CN
    - en-US
  setBuildNumber: true
  createMsixupload: true

# ADR-031：自动更新源（electron-updater + GitHub Releases；CI 用 --publish never，Release 由 Actions 上传）
publish:
  provider: github
  owner: fjtyyds
  repo: ai-desktop-pet
